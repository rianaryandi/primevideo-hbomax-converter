<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Video Cookies Converter — TSV → Raw 1 Baris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0A0A0A, #141E30);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00A8E1;
            margin-bottom: 5px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .card {
            background: #1A1A1A;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #00A8E1;
        }
        textarea {
            width: 100%;
            min-height: 180px;
            background: #0F0F0F;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #00A8E1;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00A8E1, #0091C7);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 168, 225, 0.3);
        }
        .btn-secondary {
            background: #333;
        }
        .btn-secondary:hover {
            background: #444;
            transform: none;
            box-shadow: none;
        }
        .result-box {
            background: #0F0F0F;
            border: 1px solid #00A8E1;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .stat {
            background: #222;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
        }
        .stat span {
            font-weight: bold;
            color: #00A8E1;
        }
        .copy-btn {
            background: #28a745;
            margin-top: 15px;
            padding: 10px;
            font-size: 14px;
        }
        .info {
            background: rgba(0, 168, 225, 0.1);
            border-left: 3px solid #00A8E1;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #aaa;
        }
        .upload-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #00A8E1;
            background: rgba(0, 168, 225, 0.05);
        }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Prime Video Cookies Converter</h1>
        <p class="subtitle">Format Netscape TSV → Raw 1 Baris</p>

        <div class="info">
            ✅ Mendukung: Netscape TSV • JSON Array • Raw 1 Baris<br>
            🔍 Otomatis ekstrak: <code>x-main</code> • <code>ubid-main</code> • <code>at-main</code> • <code>session-id</code>
        </div>

        <div class="card">
            <label>📂 Upload File atau Paste Cookies di bawah:</label>
            
            <div class="upload-area" id="uploadArea">
                <p>📤 Klik atau seret file .txt ke sini</p>
                <input type="file" id="fileInput" accept=".txt,.json">
            </div>

            <textarea id="inputArea" placeholder=".amazonaws.com	TRUE	/	FALSE	1899999999	x-main	...&#10;.primevideo.com	TRUE	/	FALSE	1899999999	ubid-main	..."></textarea>

            <button onclick="convertCookies()">🔄 KONVERSI → 1 BARIS</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ HAPUS SEMUA</button>

            <div class="stats" id="stats" style="display:none;">
                <div class="stat">Total: <span id="totalCount">0</span> akun</div>
                <div class="stat">Valid: <span id="validCount">0</span></div>
            </div>

            <div id="resultContainer" style="display:none;">
                <label>✅ HASIL — Raw 1 Baris:</label>
                <div class="result-box" id="resultArea"></div>
                <button class="copy-btn" onclick="copyResult()">📋 SALIN HASIL</button>
                <button class="btn-secondary" onclick="downloadResult()" style="margin-top:10px;">💾 DOWNLOAD .TXT</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const inputArea = document.getElementById('inputArea');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                inputArea.value = e.target.result;
            };
            reader.readAsText(file);
        }

        // Decode URL-encoded
        function decodeValue(val) {
            if (typeof val === 'string' && val.includes('%')) {
                try { return decodeURIComponent(val); }
                catch { return val; }
            }
            return val;
        }

        // Ekstrak dari Netscape TSV
        function parseNetscape(line) {
            const parts = line.trim().split(/\t|\s+/);
            if (parts.length >= 7 && (line.includes('.primevideo.com') || line.includes('.amazonaws.com') || line.includes('amazon'))) {
                return { name: parts[5], value: decodeValue(parts[6]) };
            }
            return null;
        }

        // Ekstrak 1 baris
        function extractRaw1Line(text) {
            const result = {};
            const patterns = [
                'x-main', 'ubid-main', 'at-main', 'session-id', 'csrf', 'i18n-prefs', 'sess-at-main'
            ];
            patterns.forEach(key => {
                const regex = new RegExp(`${key}=([^;&\\s]+)`, 'gi');
                const match = text.match(regex);
                if (match) {
                    const valMatch = text.match(new RegExp(`${key}=([^;&\\s]+)`, 'i'));
                    if (valMatch) result[key] = decodeValue(valMatch[1]);
                }
            });
            return result;
        }

        // Ekstrak dari JSON
        function parseJSON(text) {
            try {
                const data = JSON.parse(text);
                const cookies = Array.isArray(data) ? data : [data];
                const result = {};
                cookies.forEach(c => {
                    if (c.name && c.value) {
                        result[c.name] = decodeValue(c.value);
                    }
                });
                return result;
            } catch {
                return null;
            }
        }

        // Cek apakah ini blok 1 akun lengkap
        function processAllCookies(text) {
            const lines = text.split('\n');
            const allAccounts = [];
            let currentAccount = {};
            
            // Cek format 1 baris massal dulu
            const singleLines = text.split('\n').filter(l => l.trim() && l.includes('x-main='));
            if (singleLines.length > 0) {
                singleLines.forEach(line => {
                    const extracted = extractRaw1Line(line);
                    if (Object.keys(extracted).length > 0) {
                        allAccounts.push(extracted);
                    }
                });
                return allAccounts;
            }

            // Proses per baris untuk format TSV
            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;
                
                // Coba JSON
                if (line.startsWith('[{') || line.startsWith('{')) {
                    const jsonResult = parseJSON(line);
                    if (jsonResult && Object.keys(jsonResult).length > 0) {
                        allAccounts.push(jsonResult);
                        return;
                    }
                }

                // Coba Netscape
                const ns = parseNetscape(line);
                if (ns) {
                    currentAccount[ns.name] = ns.value;
                    // Kalau ketemu x-main = tanda awal akun baru
                    if (ns.name === 'x-main' && Object.keys(currentAccount).length > 1) {
                        allAccounts.push({...currentAccount});
                        currentAccount = {};
                    }
                }
            });

            if (Object.keys(currentAccount).length > 0) {
                allAccounts.push(currentAccount);
            }

            return allAccounts;
        }

        // Ubah jadi 1 baris
        function toRaw1Line(cookieObj) {
            const keys = ['x-main', 'ubid-main', 'at-main', 'session-id', 'csrf'];
            const parts = [];
            keys.forEach(k => {
                if (cookieObj[k]) parts.push(`${k}=${cookieObj[k]}`);
            });
            return parts.join(';');
        }

        function convertCookies() {
            const input = inputArea.value.trim();
            if (!input) {
                alert('❌ Masukkan cookies terlebih dahulu!');
                return;
            }

            const accounts = processAllCookies(input);
            if (accounts.length === 0) {
                alert('❌ Tidak dapat membaca format cookies! Pastikan format benar.');
                return;
            }

            const validAccounts = accounts.filter(acc => acc['x-main'] || acc['ubid-main']);
            const outputLines = validAccounts.map(acc => toRaw1Line(acc));

            // Tampilkan hasil
            document.getElementById('totalCount').textContent = accounts.length;
            document.getElementById('validCount').textContent = validAccounts.length;
            document.getElementById('stats').style.display = 'flex';
            
            document.getElementById('resultArea').textContent = outputLines.join('\n');
            document.getElementById('resultContainer').style.display = 'block';
        }

        function copyResult() {
            const text = document.getElementById('resultArea').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Berhasil disalin!');
            });
        }

        function downloadResult() {
            const text = document.getElementById('resultArea').textContent;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `prime_raw_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            inputArea.value = '';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            fileInput.value = '';
        }
    </script>
</body>
</html>
