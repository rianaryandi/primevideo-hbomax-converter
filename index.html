<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cookie File Converter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#141414,#292929);
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:650px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#e50914;
}

.header p{
    color:#aaa;
    margin-top:8px;
}


.card{
    background:#1f1f1f;
    padding:22px;
    border-radius:14px;
    box-shadow:0 5px 20px #0008;
}


.formats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
}


.tag{
    background:#333;
    padding:10px;
    text-align:center;
    border-radius:6px;
}


.tag.active{
    background:#e50914;
}



.upload{
    border:2px dashed #555;
    padding:25px;
    text-align:center;
    border-radius:10px;
    cursor:pointer;
}


.upload:hover{
    border-color:#e50914;
}


input[type=file]{
    display:none;
}


textarea{

    width:100%;
    min-height:160px;
    margin-top:10px;

    background:#292929;
    color:white;

    border:1px solid #444;
    border-radius:8px;

    padding:12px;

    font-family:monospace;
}


button{

    width:100%;
    margin-top:15px;

    padding:14px;

    background:#e50914;
    color:white;

    border:none;
    border-radius:8px;

    cursor:pointer;
    font-size:16px;
}


button:hover{
    background:#f40612;
}



.result{

    margin-top:20px;
    display:none;

}


.result.show{
    display:block;
}



.box{

    padding:15px;
    border-radius:8px;
    margin-bottom:10px;

}



.success{

    background:#064e3b;
    border:1px solid #10b981;

}


.error{

    background:#450a0a;
    border:1px solid #ef4444;

}


pre{

    white-space:pre-wrap;
    word-break:break-word;

    background:#111;
    padding:12px;

    border-radius:8px;

    font-size:12px;

}


</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>📂 Cookie File Converter</h1>

<p>Upload & Analisa Format File</p>

</div>



<div class="card">



<div class="formats">

<div class="tag" id="netscape">
Netscape
</div>

<div class="tag" id="json">
JSON
</div>

<div class="tag" id="raw">
RAW
</div>

</div>




<label class="upload">

<div id="uploadText">
📁 Klik atau Drop File
</div>

<input type="file" id="fileInput" accept=".txt,.json">

</label>



<p id="fileInfo">
Belum ada file
</p>




<textarea 
id="content"
placeholder="Isi file akan muncul disini">
</textarea>



<button id="process">

🔍 Analisa File

</button>



<div class="result" id="result">

<div id="message"></div>

<pre id="preview"></pre>

</div>



</div>


</div>




<script>


const fileInput =
document.getElementById("fileInput");


const uploadText =
document.getElementById("uploadText");


const fileInfo =
document.getElementById("fileInfo");


const content =
document.getElementById("content");


const result =
document.getElementById("result");


const message =
document.getElementById("message");


const preview =
document.getElementById("preview");



const tags={

netscape:
document.getElementById("netscape"),

json:
document.getElementById("json"),

raw:
document.getElementById("raw")

};



let currentFile=null;



function resetTags(){

Object.values(tags)
.forEach(x=>x.classList.remove("active"));

}




fileInput.onchange=e=>{

const file=e.target.files[0];

if(file)
readFile(file);

};





function readFile(file){

currentFile=file;


fileInfo.innerHTML=
`📄 ${file.name} (${(file.size/1024).toFixed(2)} KB)`;


uploadText.innerHTML=
"✅ "+file.name;



const reader=new FileReader();


reader.onload=e=>{

content.value=e.target.result;

detectFormat(e.target.result);

};


reader.readAsText(file);


}





content.oninput=()=>{

detectFormat(content.value);

};





function detectFormat(text){


resetTags();


let format="Unknown";



if(text.trim().startsWith("[") &&
text.includes('"name"')){

tags.json.classList.add("active");

format="JSON";

}


else if(
text.includes("\t")
){

tags.netscape.classList.add("active");

format="Netscape";

}


else if(
text.includes("=")
){

tags.raw.classList.add("active");

format="RAW";

}


return format;

}





document
.getElementById("process")
.onclick=()=>{


const text=
content.value.trim();



if(!text){

showError(
"File kosong"
);

return;

}



const format=
detectFormat(text);



let lines=
text.split("\n").length;



showSuccess(
`
Format : ${format}

Jumlah baris :
${lines}

File :
${currentFile?
currentFile.name:
"Paste manual"}

`
);



preview.textContent=
text.substring(0,3000);



};





function showSuccess(text){


result.classList.add("show");


message.innerHTML=
`
<div class="box success">
${text.replace(/\n/g,"<br>")}
</div>
`;

}





function showError(text){


result.classList.add("show");


message.innerHTML=
`
<div class="box error">
❌ ${text}
</div>
`;

}



</script>


</body>
</html>
